[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
cashu = "0.16.0"
# cdk supplies `wallet::MintConnector` (the HTTP client surface for keysets,
# swap, etc.). We only need the wallet half — no mint, no signatory.
cdk = { version = "0.16.0", default-features = false, features = ["wallet"] }
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
