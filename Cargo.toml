[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
# axum 0.7 powers the NUT-24 HTTP middleware in `cdk-pop-verifier`. Pinned
# to 0.7 because the validator surface is built around the 0.7
# `middleware::from_fn_with_state` + `Next::run(Request)` signatures; 0.8
# tweaks the middleware ergonomics enough to warrant a deliberate upgrade
# pass later.
axum = "0.7"
cashu = "0.16.0"
# cdk supplies `wallet::MintConnector` (the HTTP client surface for keysets,
# swap, etc.). We only need the wallet half — no mint, no signatory.
cdk = { version = "0.16.0", default-features = false, features = ["wallet"] }
# `clap` parses CLI args for the `cdk-pop-verifier-demo` binary. Derive
# feature only — the demo's `Args` struct uses `#[derive(Parser)]`.
clap = { version = "4", features = ["derive"] }
# `http` is re-exported by axum but we use its types directly for header
# construction in the middleware (StatusCode, HeaderName, HeaderValue).
http = "1"
# `rand` produces the demo handler's random u64. Pin to 0.8: bitcoin
# / secp256k1 (transitive via cashu) already pull 0.8, so this avoids
# adding a second `rand` major to the dep graph.
rand = "0.8"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `rt-multi-thread` is needed by the demo's `#[tokio::main]`; `net` for
# its `TcpListener`. `macros` + `rt` already covered the verifier crate's
# `#[tokio::test]` cases.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net"] }
# `tower` provides `ServiceExt::oneshot` used by the middleware unit tests
# to drive the router without a TCP listener.
tower = "0.5"
# `tracing` + `tracing-subscriber` give the demo a structured "listening
# on …" log line and pick up `RUST_LOG=…` via the env-filter feature.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# `base64` 0.22 (URL_SAFE_NO_PAD engine) implements the draft-httpauth-payment-00
# `request` and credentials envelopes. Already transitively pulled in by
# reqwest/hyper-util so adding it as a direct workspace dep does not
# enlarge the build graph.
base64 = "0.22"
# `uuid` v4 generates the per-request challenge `id` value the draft mandates
# on `WWW-Authenticate: Payment`. The `v4` feature wires up the random-uuid
# constructor; `cashu` already pulls the same crate transitively.
uuid = { version = "1", features = ["v4"] }
